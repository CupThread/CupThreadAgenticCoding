name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only builds and tests; it never pushes, comments, or releases.
# Scoping the token to read-only keeps a malicious PR-controlled source file
# (go test executes it) from reaching a write-capable GITHUB_TOKEN (CodeRabbit
# review of #399, CWE-732).
permissions:
  contents: read

jobs:
  build:
    # Unit tests only run for pushes to main and for pull requests opened by
    # lexrus. PRs from anyone else are skipped entirely: go test executes
    # PR-controlled source, and skipped runs also save Runzivo minutes.
    if: github.event_name == 'push' || github.event.pull_request.user.login == 'lexrus'
    runs-on: rzv-ubuntu-24.04-x64-2vcpu-8gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      # staticcheck (issue #397): vet misses the dead-state/unused-field/style
      # class (SA4006, U1000, S1017, ST1005) that had accumulated on main; run
      # it unpinned so every CI run sees the current release, and keep the
      # tree at zero findings.
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go test ./...
      # Runners use umask 0022, so a permission fixture that silently depends
      # on it would only fail on contributor machines (issue #281). Re-run the
      # config-permission suite with a hostile umask to keep that class gated.
      # The selector must enumerate every fixture family in
      # config_permissions_test.go — a stale name silently runs nothing and
      # still passes (the old TestWorldReadable selector matched no test
      # after the #186/#390 renames; a name only matches when the alternative
      # directly follows "Test", so Loosened/Vanished/Write/Directory lead the
      # names of the fixtures SaveTemp alone misses).
      - run: |
          umask 0077
          go test ./internal/cmd/ -count=1 -run 'Test(GroupWorldAccessible|OwnerOnly|MissingConfigFile|RecoveryFile|SaveTemp|Loosened|Vanished|Write|Directory)'
      # The GOOS-specific source files (lock_windows.go, the !unix && !windows
      # config-lock stub, the confirm_tty variants) are invisible to the
      # linux-only steps above; compile every supported target so a break to
      # them cannot ship silently (issue #193).
      - run: GOOS=windows go build ./... && GOOS=windows go vet ./...
      - run: GOOS=plan9 go build ./...

  windows:
    # Same author gate as the build job: no test runs for PRs from other accounts.
    # The runner stays on GitHub-hosted Windows: Runzivo has no Windows runners.
    if: github.event_name == 'push' || github.event.pull_request.user.login == 'lexrus'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
